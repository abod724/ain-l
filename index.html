<body>

  <!-- 🌟 أيقونة نبراس العائمة -->

  <h1>لغة عين للبرمجة</h1>
  <p class="hint">اكتب كودك بالعربي أدناه — يدعم: متغيرات، شروط، حلقات، دوال، مكتبات، أوامر صفحة.</p>

  <textarea id="كود_عين">غير_اللون("#eef2ff")
أضف_عنوان("🐍 لغة عين للبرمجة")

# متغيرات
الاسم = "عبدالله"
العمر = ٢٥
المدينة = "الرياض"

اطبع("أهلاً " + الاسم)
اطبع("عمرك: " + العمر)
اطبع("من " + المدينة)

# شرط
إذا (العمر >= ١٨) {
  اطبع("أنت بالغ ✅")
} آخر {
  اطبع("أنت قاصر ❌")
}

# دالة
دالة تحية(شخص) {
  إرجع "مرحبًا يا " + شخص
}
اطبع(تحية("سارة"))

# حلقة
كرر ع من ١ إلى ٥ {
  اطبع("العدد: " + ع)
}

# مكتبات
اطبع("جذر ٤٩ = " + جذر(٤٩))
اطبع("٣ أس ٤ = " + قوة(٣، ٤))
اطبع("عشوائي (١، ١٠٠) = " + عشوائي(١، ١٠٠))

# قائمة
أرقام = [١٠، ٢٠، ٣٠، ٤٠]
اطبع("مجموع الأرقام: " + مجموع(أرقام))

# صفحة
أضف_زر("نبراس GP", "https://nibras-al.onrender.com/")
أضف_رابط("Google", "https://google.com")
أضف_صورة("https://picsum.photos/400/180", "صورة")
اطبع("✅ تم")</textarea>

  <div class="أزرار">
    <button class="btn-primary" onclick="شغل()">▶ تشغيل</button>
    <button class="btn-warning" onclick="احفظ()">💾 حفظ الكود</button>
    <button class="btn-success" onclick="انسخ()">📋 نسخ الناتج</button>
    <button class="btn-danger" onclick="امسح_الكود()">🗑️ مسح الكود</button>
    <button class="btn-danger" onclick="امسح_الناتج()">🧹 مسح الناتج</button>
  </div>

  <h2>📟 الناتج:</h2>
  <div id="الناتج"></div>

  <h2>🖥️ معاينة الصفحة:</h2>
  <div id="مخرجات_الويب"></div>

<script>
// ============ أدوات ============
const خريطة_ع_إ = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const خريطة_إ_ع = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
const تحويل_الأرقام_للإنجليزية = ن => ن.replace(/[٠-٩]/g, ح => خريطة_ع_إ[ح]);
const تحويل_الأرقام_للعربية   = ن => String(ن).replace(/[0-9]/g, ر => خريطة_إ_ع[ر]);

// ============ المكتبات ============
const مكتبة_رياضيات = {
  'رقم': (ق) => Number(ق), 'عدد': (ق) => Number(ق),
  'جذر': (ن) => Math.sqrt(Number(ن)), 'قوة': (أ, ب) => Math.pow(Number(أ), Number(ب)),
  'مطلق': (ن) => Math.abs(Number(ن)), 'أكبر': (أ, ب) => Math.max(Number(أ), Number(ب)),
  'أصغر': (أ, ب) => Math.min(Number(أ), Number(ب)), 'دائري': (ن) => Math.round(Number(ن)),
  'أرضية': (ن) => Math.floor(Number(ن)), 'سقفية': (ن) => Math.ceil(Number(ن)),
  'عشوائي': (أ, ب) => Math.floor(Math.random() * (Number(ب) - Number(أ) + 1)) + Number(أ),
  'باي': () => Math.PI, 'مجموع': (ق) => ق.reduce((س, ع) => س + Number(ع), 0),
};
const مكتبة_نصوص = {
  'طول': (ن) => String(ن).length, 'جزء': (ن, م, إ) => String(ن).slice(Number(م), Number(إ)),
  'بحث': (ن, ج) => String(ن).indexOf(String(ج)),
  'استبدل': (ن, ق, ج) => String(ن).split(String(ق)).join(String(ج)),
  'قسم': (ن, ف) => String(ن).split(String(ف)), 'رابط': (ق, ف) => ق.join(ف ?? ' '),
  'يحتوي': (ن, ج) => String(ن).includes(String(ج)),
  'أزل_فراغ': (ن) => String(ن).trim(),
  'كبير': (ن) => String(ن).toUpperCase(), 'صغير': (ن) => String(ن).toLowerCase(),
};
const مكتبة_قوائم = {
  'أضف_عنصر': (ق, ع) => { ق.push(ع); return ق; },
  'احذف_الأخير': (ق) => { ق.pop(); return ق; },
  'طول_قائمة': (ق) => ق.length, 'رتب': (ق) => [...ق].sort((أ, ب) => أ > ب ? 1 : -1),
  'اعكس': (ق) => [...ق].reverse(), 'في_القائمة': (ق, ع) => ق.includes(ع),
  'أول': (ق) => ق[0], 'آخر': (ق) => ق[ق.length - 1],
};
const مكتبة_وقت = {
  'السنة': () => new Date().getFullYear(), 'الشهر': () => new Date().getMonth() + 1,
  'اليوم': () => new Date().getDate(), 'الساعة': () => new Date().getHours(),
  'الدقيقة': () => new Date().getMinutes(),
  'تاريخ_اليوم': () => new Date().toLocaleDateString('ar-EG'),
};
const مكتبة_تفاعل = {
  'اطلب': (س) => prompt(String(س)) ?? '', 'تأكيد': (س) => confirm(String(س)),
  'نبه': (ر) => { alert(String(ر)); return null; },
};
const مكتبة_ألوان = {
  'لون_عشوائي': () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
  'لون_فاتح': () => '#' + ['e3f2fd','e8f5e9','fce4ec','fff8e1','f3e5f5','f0f9ff'][Math.floor(Math.random()*6)],
  'لون_غامق': () => '#' + ['1e293b','0f172a','111827','1f2937','3f3f46'][Math.floor(Math.random()*5)],
};
const المكتبات = { ...مكتبة_رياضيات, ...مكتبة_نصوص, ...مكتبة_قوائم, ...مكتبة_وقت, ...مكتبة_تفاعل, ...مكتبة_ألوان };

// ============ Tokenizer ============
const الكلمات_المحجوزة = new Set([
  'متغير','اطبع','إذا','آخر','كرر','من','إلى','دالة','إرجع','بينما','و','أو',
  'أضف_نص','أضف_عنوان','غير_اللون','أضف_زر','أضف_رابط','أضف_صورة','عيّن_الخط'
]);
function tokenize(code) {
  code = تحويل_الأرقام_للإنجليزية(code);
  const tokens = [];
  const regex = /\s*(#[^\n]*|\/\/[^\n]*|==|!=|>=|<=|[=<>+\-*/%(){}\[\],،!]|"[^"]*"|'[^']*'|[\p{L}_][\p{L}\p{N}_]*|\d+(?:\.\d+)?)/gu;
  let m;
  while ((m = regex.exec(code)) !== null) {
    let value = m[1];
    if (value.startsWith('#') || value.startsWith('//')) continue;
    let type = 'معرف';
    if (الكلمات_المحجوزة.has(value)) type = 'كلمة_محجوزة';
    else if (/^\d/.test(value)) type = 'رقم';
    else if (/^["']/.test(value)) { type = 'نص'; value = value.slice(1, -1); }
    else if (/^[=<>+\-*/%(){}\[\],،!]/.test(value)) type = 'رمز';
    tokens.push({ type, value });
  }
  tokens.push({ type: 'نهاية', value: '' });
  return tokens;
}

// ============ Parser ============
function parse(tokens) {
  let pos = 0;
  const peek = (ن = 0) => tokens[pos + ن] || tokens[tokens.length - 1];
  const consume = () => tokens[pos++];
  const expect = v => { if (peek().value !== v) throw new Error(`متوقع "${v}" لكن وجدت "${peek().value || 'نهاية'}"`); return consume(); };
  function parseProgram() { const b = []; while (peek().type !== 'نهاية') b.push(parseStatement()); return { type: 'برنامج', body: b }; }
  function parseStatement() {
    const t = peek();
    if (t.type === 'كلمة_محجوزة') {
      if (['أضف_نص','أضف_عنوان','غير_اللون','أضف_زر','أضف_رابط','أضف_صورة','عيّن_الخط'].includes(t.value)) return parsePageCall();
      if (t.value === 'اطبع') return parsePrint();
      if (t.value === 'متغير') return parseVar();
      if (t.value === 'إذا') return parseIf();
      if (t.value === 'بينما') return parseWhile();
      if (t.value === 'كرر') return parseRepeat();
      if (t.value === 'دالة') return parseFunc();
      if (t.value === 'إرجع') return parseReturn();
    }
    if (t.type === 'معرف' && peek(1).value === '=') { const n = consume().value; consume(); return { type: 'متغير', name: n, val: parseExpression() }; }
    return { type: 'تعبير', expr: parseExpression() };
  }
  function parsePageCall() {
    const n = consume().value; expect('(');
    const a = [];
    while (peek().value !== ')') { a.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; }
    expect(')');
    return { type: 'استدعاء_صفحة', name: n, args: a };
  }
  function parsePrint() { consume(); expect('('); const e = parseExpression(); expect(')'); return { type: 'طباعة', expr: e }; }
  function parseVar() { consume(); const n = consume().value; let v = null; if (peek().value === '=') { consume(); v = parseExpression(); } return { type: 'متغير', name: n, val: v }; }
  function parseIf() { consume(); expect('('); const c = parseExpression(); expect(')'); const b = parseBlock(); let a = null; if (peek().value === 'آخر') { consume(); a = parseBlock(); } return { type: 'شرط', cond: c, block: b, alt: a }; }
  function parseWhile() { consume(); expect('('); const c = parseExpression(); expect(')'); return { type: 'بينما', cond: c, block: parseBlock() }; }
  function parseRepeat() {
    consume();
    if (peek().type === 'معرف' && peek(1).value === 'من') { const n = consume().value; consume(); const f = parseExpression(); consume(); const t = parseExpression(); return { type: 'كرر_من_إلى', name: n, from: f, to: t, block: parseBlock() }; }
    return { type: 'كرر', count: parseExpression(), block: parseBlock() };
  }
  function parseFunc() { consume(); const n = consume().value; expect('('); const p = []; while (peek().value !== ')') { p.push(consume().value); if (peek().value === ',' || peek().value === '،') consume(); else break; } expect(')'); return { type: 'دالة', name: n, params: p, block: parseBlock() }; }
  function parseReturn() { consume(); if (peek().value === '}' || peek().type === 'نهاية') return { type: 'إرجع', expr: null }; return { type: 'إرجع', expr: parseExpression() }; }
  function parseBlock() { expect('{'); const b = []; while (peek().value !== '}') b.push(parseStatement()); expect('}'); return { type: 'كتلة', body: b }; }
  function parseExpression() { return parseOr(); }
  function parseOr() { let l = parseAnd(); while (peek().value === 'أو') { consume(); l = { type:'ثنائي', op:'أو', l, r: parseAnd() }; } return l; }
  function parseAnd() { let l = parseComp(); while (peek().value === 'و') { consume(); l = { type:'ثنائي', op:'و', l, r: parseComp() }; } return l; }
  function parseComp() { let l = parseAdd(); while (['==','!=','>','<','>=','<='].includes(peek().value)) { const op = consume().value; l = { type:'ثنائي', op, l, r: parseAdd() }; } return l; }
  function parseAdd() { let l = parseMul(); while (peek().value === '+' || peek().value === '-') { const op = consume().value; l = { type:'ثنائي', op, l, r: parseMul() }; } return l; }
  function parseMul() { let l = parseUnary(); while (['*','/','%'].includes(peek().value)) { const op = consume().value; l = { type:'ثنائي', op, l, r: parseUnary() }; } return l; }
  function parseUnary() { if (peek().value === '-') { consume(); return { type:'أحادي', op:'-', expr: parseUnary() }; } if (peek().value === '!') { consume(); return { type:'أحادي', op:'!', expr: parseUnary() }; } return parseCall(); }
  function parseCall() { let e = parsePrim(); while (peek().value === '(') { consume(); const a = []; while (peek().value !== ')') { a.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; } expect(')'); e = { type:'استدعاء_دالة', callee: e, args: a }; } return e; }
  function parsePrim() {
    const t = peek();
    if (!t || t.type === 'نهاية') throw new Error('تعبير غير مكتمل');
    if (t.type === 'رقم') { consume(); return { type:'رقم', val: parseFloat(t.value) }; }
    if (t.type === 'نص') { consume(); return { type:'نص', val: t.value }; }
    if (t.value === '(') { consume(); const e = parseExpression(); expect(')'); return e; }
    if (t.value === '[') { consume(); const items = []; while (peek().value !== ']') { items.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; } expect(']'); return { type:'مصفوفة', items }; }
    if (t.type === 'معرف' || t.type === 'كلمة_محجوزة') { consume(); return { type:'متغير_مرجع', name: t.value }; }
    throw new Error(`رمز غير متوقع: "${t.value}"`);
  }
  return parseProgram();
}

// ============ Interpreter ============
function تنفيذ(ast, طباعة) {
  const صندوق = document.getElementById('مخرجات_الويب');
  const بيئة_عالمية = {};
  const دوال = {};
  const تنسيق = v => { if (v === null || v === undefined) return ''; if (typeof v === 'boolean') return v ? 'صحيح' : 'خطأ'; if (Array.isArray(v)) return '[' + v.map(تنسيق).join('، ') + ']'; return String(v); };

  function قيمة(عقدة, بيئة) {
    if (!عقدة) return null;
    switch (عقدة.type) {
      case 'رقم': case 'نص': return عقدة.val;
      case 'مصفوفة': return عقدة.items.map(i => قيمة(i, بيئة));
      case 'متغير_مرجع':
        if (عقدة.name in بيئة) return بيئة[عقدة.name];
        if (عقدة.name in بيئة_عالمية) return بيئة_عالمية[عقدة.name];
        throw new Error(`متغير غير معرّف: ${عقدة.name}`);
      case 'أحادي': { const v = قيمة(عقدة.expr, بيئة); return عقدة.op === '-' ? -v : !v; }
      case 'ثنائي': {
        if (عقدة.op === 'و') { const ل = قيمة(عقدة.l, بيئة); return ل ? قيمة(عقدة.r, بيئة) : ل; }
        if (عقدة.op === 'أو') { const ل = قيمة(عقدة.l, بيئة); return ل ? ل : قيمة(عقدة.r, بيئة); }
        const ل = قيمة(عقدة.l, بيئة), ر = قيمة(عقدة.r, بيئة);
        switch (عقدة.op) {
          case '+': return ل + ر; case '-': return ل - ر; case '*': return ل * ر;
          case '/': return ل / ر; case '%': return ل % ر;
          case '==': return ل == ر; case '!=': return ل != ر;
          case '>': return ل > ر; case '<': return ل < ر;
          case '>=': return ل >= ر; case '<=': return ل <= ر;
        }
        throw new Error(`عملية غير معروفة: ${عقدة.op}`);
      }
      case 'استدعاء_دالة': {
        const name = عقدة.callee.name;
        const args = عقدة.args.map(a => قيمة(a, بيئة));
        if (دوال[name]) return استدعاء_دالة(دوال[name], args);
        if (المكتبات[name]) return المكتبات[name](...args);
        throw new Error(`دالة غير معرّفة: ${name}`);
      }
    }
    throw new Error(`لا يمكن تقييم: ${عقدة.type}`);
  }

  function استدعاء_دالة(دالة, args) {
    const بيئة_محلية = {};
    دالة.params.forEach((p, i) => { بيئة_محلية[p] = args[i] ?? null; });
    try { for (const s of دالة.block.body) نفّذ_عقدة(s, بيئة_محلية); }
    catch (e) { if (e && e.__إرجع) return e.value; throw e; }
    return null;
  }

  function نفّذ_عقدة(عقدة, بيئة) {
    if (!عقدة) return;
    switch (عقدة.type) {
      case 'برنامج': for (const s of عقدة.body) نفّذ_عقدة(s, بيئة_عالمية); break;
      case 'كتلة': for (const s of عقدة.body) نفّذ_عقدة(s, بيئة); break;
      case 'متغير': بيئة[عقدة.name] = عقدة.val ? قيمة(عقدة.val, بيئة) : null; break;
      case 'تعبير': قيمة(عقدة.expr, بيئة); break;
      case 'طباعة': طباعة(تحويل_الأرقام_للعربية(تنسيق(قيمة(عقدة.expr, بيئة)))); break;
      case 'شرط': if (قيمة(عقدة.cond, بيئة)) نفّذ_عقدة(عقدة.block, بيئة); else if (عقدة.alt) نفّذ_عقدة(عقدة.alt, بيئة); break;
      case 'بينما': { let ح = 0; while (قيمة(عقدة.cond, بيئة)) { نفّذ_عقدة(عقدة.block, بيئة); if (++ح > 100000) throw new Error('حلقة لا نهائية'); } break; }
      case 'كرر': { const n = Number(قيمة(عقدة.count, بيئة)); if (!Number.isFinite(n) || n < 0) throw new Error('عدد تكرارات غير صحيح'); for (let i = 0; i < n; i++) نفّذ_عقدة(عقدة.block, بيئة); break; }
      case 'كرر_من_إلى': { const from = Number(قيمة(عقدة.from, بيئة)); const to = Number(قيمة(عقدة.to, بيئة)); for (let i = from; i <= to; i++) { بيئة[عقدة.name] = i; نفّذ_عقدة(عقدة.block, بيئة); } break; }
      case 'دالة': دوال[عقدة.name] = { params: عقدة.params, block: عقدة.block }; break;
      case 'إرجع': throw { __إرجع: true, value: عقدة.expr ? قيمة(عقدة.expr, بيئة) : null };
      case 'استدعاء_صفحة': صفحة(عقدة, بيئة); break;
    }
  }

  function صفحة(عقدة, بيئة) {
    const ق = عقدة.args.map(a => قيمة(a, بيئة));
    switch (عقدة.name) {
      case 'أضف_نص': { const p = document.createElement('p'); p.textContent = تحويل_الأرقام_للعربية(ق.join('')); صندوق.appendChild(p); break; }
      case 'أضف_عنوان': { const h = document.createElement('h3'); h.textContent = تحويل_الأرقام_للعربية(ق.join('')); صندوق.appendChild(h); break; }
      case 'غير_اللون': document.body.style.backgroundColor = String(ق[0] || '#f0f0f0'); break;
      case 'أضف_زر': { const z = document.createElement('a'); z.href = String(ق[1] || '#'); z.target = '_blank'; z.rel = 'noopener'; z.className = 'زر-عين'; z.textContent = String(ق[0] || 'زر'); صندوق.appendChild(z); break; }
      case 'أضف_رابط': { const l = document.createElement('a'); l.href = String(ق[1] || '#'); l.target = '_blank'; l.rel = 'noopener'; l.textContent = String(ق[0] || 'رابط'); صندوق.appendChild(document.createElement('br')); صندوق.appendChild(l); break; }
      case 'أضف_صورة': { const i = document.createElement('img'); i.src = String(ق[0] || ''); i.alt = String(ق[1] || 'صورة'); i.title = i.alt; صندوق.appendChild(i); break; }
      case 'عيّن_الخط': { صندوق.style.fontFamily = String(ق[0] || 'Tahoma'); صندوق.style.fontSize = ق[1] ? Number(ق[1]) + 'px' : '16px'; break; }
    }
  }

  نفّذ_عقدة(ast, بيئة_عالمية);
}

// ============ الواجهة ============
function شغل() {
  const كود = document.getElementById('كود_عين').value;
  const ناتج = document.getElementById('الناتج');
  const ويب = document.getElementById('مخرجات_الويب');
  ناتج.innerText = '';
  ويب.replaceChildren();
  try {
    const رموز = tokenize(كود);
    const شجرة = parse(رموز);
    تنفيذ(شجرة, ر => { ناتج.innerText += ر + '\n'; });
  } catch (err) {
    ناتج.innerText = '❌ خطأ: ' + (err && err.message ? err.message : String(err));
  }
}

function احفظ() {
  const كودي = document.getElementById('كود_عين').value;
  const آمن = كودي.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ص = '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<title>كودي بلغة عين</title>\n<style>\n  body { font-family: Tahoma, sans-serif; padding: 20px; background: #f0f0f0; }\n  h1 { color: #007bff; }\n  textarea { width: 100%; min-height: 500px; font-family: Consolas, monospace; font-size: 16px; padding: 15px; border-radius: 8px; border: 2px solid #007bff; line-height: 1.9; background: #fff; direction: rtl; }\n  button { padding: 12px 24px; margin: 10px 5px 0 0; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }\n</style>\n</head>\n<body>\n  <h1>📝 كودي بلغة عين</h1>\n  <textarea id="ك" readonly>' + آمن + '</textarea>\n  <br>\n  <button onclick="navigator.clipboard.writeText(document.getElementById(\'ك\').value).then(()=>alert(\'✅ تم النسخ!\'))">📋 نسخ الكود</button>\n</body>\n</html>';
  const ب = new Blob(['\uFEFF' + ص], { type: 'text/html;charset=utf-8' });
  const ر = document.createElement('a');
  ر.href = URL.createObjectURL(ب);
  ر.download = 'كودي_عين.html';
  document.body.appendChild(ر);
  ر.click();
  document.body.removeChild(ر);
  URL.revokeObjectURL(ر.href);
}

function انسخ() {
  const ن = document.getElementById('الناتج').innerText;
  if (!ن.trim()) { alert('لا يوجد نص لنسخه!'); return; }
  const بديل = () => {
    const ta = document.createElement('textarea');
    ta.value = ن;
    ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    alert(ok ? '✅ تم النسخ!' : '❌ فشل النسخ');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(ن).then(() => alert('✅ تم النسخ!')).catch(بديل);
  } else بديل();
}

function امسح_الكود() { if (confirm('مسح الكود؟')) document.getElementById('كود_عين').value = ''; }
function امسح_الناتج() { document.getElementById('الناتج').innerText = ''; document.getElementById('مخرجات_الويب').replaceChildren(); }
</script>
